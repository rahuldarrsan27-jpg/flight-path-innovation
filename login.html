<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Hangar Log | FPI Aviation</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#060b14" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="gate">
      <div class="card hide" id="needsConfig">
        <h1>Not connected yet</h1>
        <p>
          This module has no database configured. Set <code>VITE_SUPABASE_URL</code> and
          <code>VITE_SUPABASE_ANON_KEY</code> in Netlify → Site configuration →
          Environment variables, then redeploy. See <code>src/hangar/SETUP.md</code>.
        </p>
      </div>

      <div class="card hide" id="authBox">
        <div class="brand">
          <img src="/assets/logo-mark-light.png" alt="" width="30" height="30" />
          <h1>Hangar Log</h1>
        </div>
        <p>Sign in to reach your aircraft records and job sheets.</p>
        <form id="authForm">
          <div class="row">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="username" />
          </div>
          <div class="row">
            <label for="password">Password</label>
            <input type="password" id="password" required minlength="8" autocomplete="current-password" />
          </div>
          <div class="actions">
            <button class="btn" type="submit" id="signInBtn">Sign in</button>
            <button class="btn ghost" type="button" id="signUpBtn">Create my account</button>
          </div>
        </form>
        <div class="msg" id="authMsg" role="status" aria-live="polite"></div>
        <a class="back" href="/">← Back to fpiaviation.com</a>
      </div>
    </div>
    <script type="module" src="/src/hangar/login.js"></script>
  </body>
</html>
