<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under Construction | FPI Services</title>
    <meta name="description" content="This FPI Services application is being built and will be available here shortly." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#060b14" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #060b14; --panel: rgba(255,255,255,.04);
        --ink: #f6f8fb; --muted: #aebccf; --faint: #7d8ba1;
        --blue: #2b7fff; --line: rgba(255,255,255,.1);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background:
          radial-gradient(ellipse 80% 60% at 50% 0%, rgba(43,127,255,.10), transparent 70%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: grid; place-items: center;
        padding: 32px 22px;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { width: 100%; max-width: 560px; text-align: center; }

      .brand { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 42px; }
      .brand img { height: 76px; width: 76px; display: block; }
      .brand-txt { font: 700 20px "Exo 2", sans-serif; letter-spacing: .07em; }
      .brand-txt b { font-weight: 700; }

      .tag {
        display: inline-block; font: 600 11px "Exo 2", sans-serif; letter-spacing: .22em;
        color: var(--blue); border: 1px solid rgba(43,127,255,.35);
        background: rgba(43,127,255,.08);
        padding: 7px 15px; border-radius: 999px; margin-bottom: 26px;
      }
      h1 {
        font: 700 clamp(30px, 7vw, 46px) "Exo 2", sans-serif;
        letter-spacing: -.02em; line-height: 1.1; margin-bottom: 18px;
      }
      p.lede { color: var(--muted); font-size: 16px; line-height: 1.65; margin: 0 auto 34px; max-width: 430px; }

      /* indeterminate progress — signals "in progress", not a fake percentage */
      .bar {
        width: min(260px, 80%); height: 3px; margin: 0 auto 40px;
        background: rgba(255,255,255,.09); border-radius: 3px; overflow: hidden;
      }
      .bar span {
        display: block; height: 100%; width: 38%; border-radius: 3px;
        background: linear-gradient(90deg, transparent, var(--blue), transparent);
        animation: slide 1.9s cubic-bezier(.5,0,.35,1) infinite;
      }
      @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(370%); } }

      .card {
        border: 1px solid var(--line); background: var(--panel);
        border-radius: 14px; padding: 22px 24px;
      }
      .card h2 {
        font: 600 11px "Exo 2", sans-serif; letter-spacing: .18em;
        color: var(--faint); text-transform: uppercase; margin-bottom: 14px;
      }
      .rows { display: flex; flex-direction: column; gap: 10px; font-size: 14.5px; }
      .rows a { color: var(--ink); text-decoration: none; }
      .rows a:hover { color: var(--blue); }
      .rows .k { color: var(--faint); font-size: 12.5px; display: block; margin-bottom: 2px; }

      .back {
        display: inline-block; margin-top: 34px; color: var(--faint);
        font-size: 13px; text-decoration: none;
      }
      .back:hover { color: var(--ink); }

      @media (prefers-reduced-motion: reduce) {
        .bar span { animation: none; width: 100%; opacity: .5; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="brand">
        <img src="/assets/logo-mark-light.png" alt="FPI Services" width="76" height="76" />
        <span class="brand-txt">FPI <b>SERVICES</b></span>
      </div>

      <span class="tag">COMING SOON</span>
      <h1>Under construction</h1>
      <p class="lede">
        This application is being built and will be available at this address shortly.
        Thank you for your patience.
      </p>

      <div class="bar" role="progressbar" aria-label="Development in progress"><span></span></div>

      <div class="card">
        <h2>In the meantime</h2>
        <div class="rows">
          <div>
            <span class="k">Main site</span>
            <a href="https://fpiservices.net/">fpiservices.net</a>
          </div>
          <div>
            <span class="k">General enquiries</span>
            <a href="mailto:info@fpiservices.net">info@fpiservices.net</a>
          </div>
          <div>
            <span class="k">24/7 AOG desk</span>
            <a href="tel:+233554352912">+233 55 435 2912</a>
          </div>
        </div>
      </div>

      <a class="back" href="https://fpiservices.net/">← Back to FPI Services</a>
    </main>
  </body>
</html>
